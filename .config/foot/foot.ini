font=RobotoMono Nerd Font:size=11  # https://www.nerdfonts.com/font-downloads

[colors]
foreground=dcdcdc
background=181818

[mouse-bindings]
select-extend = none

[scrollback]
lines=5000
indicator-format=percentage  # show where you are in scrollback
indicator-position=fixed

[key-bindings]
show-urls-launch=Control+Shift+o  # Default
scrollback-up-line=Control+Up
scrollback-down-line=Control+Down
prompt-prev=Shift+Up
prompt-next=Shift+Down

