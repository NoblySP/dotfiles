
# Make the temporary seek/volume bar smaller and lower
osd-bar=yes
osd-bar-w=80
osd-bar-h=2
osd-bar-align-y=0.96
osd-font-size=22
osd-level=1

# Pause on the last frame of every video instead of advancing automatically.
# Manual playlist navigation remains available.
keep-open=always

# Start silent, but have unmuting return to a comfortable volume.
volume=50
mute=yes

# Opening one video also loads the other videos in its folder. This makes the
# OSC previous/next buttons and the playlist keyboard shortcuts useful.
autocreate-playlist=same
osc=yes

hr-seek=no

demuxer-hysteresis-secs=10
